<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>填寫留言</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <!-- 步驟 1：填寫 -->
    <form id="form" class="card" novalidate>
      <h1 id="title">載入中…</h1>
      <p id="intro" class="muted"></p>
      <label for="name">你的名字 <span class="req">*必填</span></label>
      <input type="text" id="name" maxlength="50" required />
      <div class="field-error hidden" id="nameError">請填寫你的名字</div>
      <div id="questions"></div>
      <button type="submit" class="full" id="submitBtn">送出回答</button>
      <div class="msg" id="formMsg"></div>
    </form>

    <!-- 步驟 2：送出成功 -->
    <div id="thanksCard" class="card hidden">
      <h1>留言已送出 💌</h1>
      <p class="muted">謝謝你！你的留言會和大家的話一起出現在影片裡。</p>
      <button class="secondary full" id="moreBtn" type="button">再寫一則留言</button>
    </div>
  </div>

  <script>
    let config, MAX = 50;
    const $ = id => document.getElementById(id);
    const countChars = s => [...s.trim()].length; // 中文、英文、emoji 都算一個字

    async function init() {
      config = await (await fetch('/api/config')).json();
      MAX = config.maxChars || 50;
      document.title = config.title;
      $('title').textContent = config.title;
      $('intro').textContent = config.intro || '';
      // 題目可以換行：每一行都靠左對齊在題號後面（自動去掉每行開頭的空格）
      $('questions').innerHTML = config.questions.map((q, i) => `
        <label for="q${i}" class="question"><span class="qnum">${i + 1}.</span><span class="qtext">${escapeHtml(q.replace(/^[ \t\u3000]+/gm, ''))}<span class="limit">*限${MAX}字以內</span></span></label>
        <textarea id="q${i}" placeholder="寫下你想說的話…"></textarea>
        <div class="counter" id="c${i}">0 / ${MAX}</div>
        <div class="field-error hidden" id="e${i}">超過 ${MAX} 字了，請刪減一些再送出</div>
      `).join('');
      config.questions.forEach((_, i) => $('q' + i).addEventListener('input', () => checkLength(i)));
    }

    // 即時顯示字數；超過就變紅
    function checkLength(i) {
      const n = countChars($('q' + i).value), over = n > MAX;
      $('c' + i).textContent = `${n} / ${MAX}`;
      $('c' + i).classList.toggle('over', over);
      $('q' + i).classList.toggle('invalid', over);
      if (!over) $('e' + i).classList.add('hidden');
      return !over;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    $('name').addEventListener('input', () => {
      $('nameError').classList.add('hidden');
      $('name').classList.remove('invalid');
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const answers = config.questions.map((_, i) => $('q' + i).value.trim());
      const name = $('name').value.trim();
      if (!name) {
        $('nameError').classList.remove('hidden');
        $('name').classList.add('invalid');
        $('name').focus();
        $('name').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      const tooLong = config.questions.findIndex((_, i) => !checkLength(i));
      if (tooLong !== -1) {
        $('e' + tooLong).classList.remove('hidden');
        $('q' + tooLong).focus();
        $('q' + tooLong).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (answers.every(a => !a)) { $('formMsg').textContent = '請至少回答一題喔！'; return; }

      $('submitBtn').disabled = true;
      $('formMsg').textContent = '';
      try {
        const res = await fetch('/api/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, answers })
        });
        if (!res.ok) throw new Error((await res.json()).error || '送出失敗，請再試一次');
      } catch (err) {
        $('formMsg').textContent = err.message || '送出失敗，請再試一次';
        $('submitBtn').disabled = false;
        return;
      }

      $('form').classList.add('hidden');
      $('thanksCard').classList.remove('hidden');
      $('submitBtn').disabled = false;
    });

    $('moreBtn').addEventListener('click', () => {
      config.questions.forEach((_, i) => { $('q' + i).value = ''; checkLength(i); });
      $('thanksCard').classList.add('hidden');
      $('form').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    init();
  </script>
</body>
</html>
